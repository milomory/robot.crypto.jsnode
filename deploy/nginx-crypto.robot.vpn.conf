# Prepared for review; not installed. Dedicated certificate/renewal required.
# Preserve current Crypto VPN egress allowlist; reconcile with Auth before SSO.
server {
    listen 80;
    listen [::]:80;
    server_name crypto.robot.vpn;
    access_log off;
    error_log /dev/null;
    # Never forward a code received over plaintext HTTP.
    location = /auth/callback { return 400; }
    location / { return 308 https://crypto.robot.vpn$uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crypto.robot.vpn;
    ssl_certificate /etc/crypto-robot/tls/server.crt;
    ssl_certificate_key /etc/crypto-robot/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Callback codes may appear in request context of nginx error messages too.
    # Do not log requests for this small private vhost; use metrics/health probes.
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;
    allow 157.22.184.131;
    allow 38.54.13.221;
    allow 185.9.27.65;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:5758;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
